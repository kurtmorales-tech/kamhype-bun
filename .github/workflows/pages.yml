name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        # npm install instead of the oven setup action: that action failed
        # to resolve in this repo ("repository not found" at job setup).
        run: npm install -g bun

      - name: Install dependencies
        run: bun install

      - name: Export static site
        # Custom domain at the root: no base path. CNAME must match the
        # custom domain configured in Settings -> Pages and in DNS.
        env:
          BASE_PATH: ""
          CNAME: "kmwebdesign.xyz"
        run: bun run build:pages

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
